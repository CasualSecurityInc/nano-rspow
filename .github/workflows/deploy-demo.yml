name: Deploy Browser Demo to GitHub Pages

on:
  push:
    branches:
      - main

# Native deployments require specific OIDC token and pages permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from clobbering each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy browser demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          wget -qO- https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.121/wasm-bindgen-0.2.121-x86_64-unknown-linux-musl.tar.gz | tar -xz
          echo "${{ github.workspace }}/wasm-bindgen-0.2.121-x86_64-unknown-linux-musl" >> $GITHUB_PATH

      - name: Build demo
        run: python3 nano-rspow-web/browser-demo/build-demo.py

      # Step 1: Package the compiled output directory into a temporary Pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'nano-rspow-web/browser-demo'

      # Step 2: Push the packaged asset directly to the native Pages infrastructure
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5