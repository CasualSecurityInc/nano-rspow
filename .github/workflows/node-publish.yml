name: Publish Node.js Bindings

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    name: Check version and publication status
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check-npm.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare major.minor versions
        run: |
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO_MM=$(echo "$CARGO" | cut -d. -f1-2)
          NODE=$(jq -r .version nano-rspow-node/package.json)
          NODE_MM=$(echo "$NODE" | cut -d. -f1-2)
          WEB=$(jq -r .version nano-rspow-web/package.json)
          WEB_MM=$(echo "$WEB" | cut -d. -f1-2)
          echo "Cargo: $CARGO  Node: $NODE  Web: $WEB"
          FAILED=0
          [ "$NODE_MM" != "$CARGO_MM" ] && echo "ERROR: Node $NODE vs Cargo $CARGO" && FAILED=1
          [ "$WEB_MM"  != "$CARGO_MM" ] && echo "ERROR: Web $WEB vs Cargo $CARGO"   && FAILED=1
          [ $FAILED -eq 1 ] && echo "Patch versions may diverge; major.minor must match." && exit 1
          echo "OK: all packages on major.minor $CARGO_MM"

      - name: Check if already published on NPM
        id: check-npm
        run: |
          NAME=$(jq -r .name nano-rspow-node/package.json)
          VERSION=$(jq -r .version nano-rspow-node/package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "✅ $NAME@$VERSION is already published! Skipping entire build matrix."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 $NAME@$VERSION is not yet published. Building."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Node Bindings - ${{ matrix.settings.target }}
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nano-rspow-node

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # Add ports.ubuntu.com as the arm64 source (security.ubuntu.com doesn't serve arm64)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/ports-arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ports-arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ports-arm64.list
          # apt-get update may emit 404 errors for arm64 from security.ubuntu.com; those are harmless
          sudo apt-get update -o APT::Update::Error-Mode=any 2>&1 | grep -v "^E:" || true
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: nano-rspow-node
        run: npm install

      - name: Build
        working-directory: nano-rspow-node
        run: npm run build -- --target ${{ matrix.settings.target }}

      - name: Build CLI
        run: cargo build -p nano-rspow-cli --release --target ${{ matrix.settings.target }}

      - name: Copy CLI Binary
        shell: bash
        run: |
          if [ "${{ matrix.settings.host }}" = "windows-latest" ]; then
            cp target/${{ matrix.settings.target }}/release/nano-rspow.exe nano-rspow-node/
          else
            cp target/${{ matrix.settings.target }}/release/nano-rspow nano-rspow-node/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            nano-rspow-node/*.node
            nano-rspow-node/nano-rspow*
          if-no-files-found: error

  publish-platforms:
    name: Publish platform packages to NPM
    runs-on: ubuntu-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: nano-rspow-node
        run: npm install

      - name: Create npm platform dirs
        working-directory: nano-rspow-node
        run: npx napi create-npm-dirs

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts into platform dirs
        working-directory: nano-rspow-node
        run: npx napi artifacts --output-dir ../artifacts --npm-dir npm

      - name: Copy CLI native binaries into platform dirs
        shell: bash
        working-directory: nano-rspow-node
        run: |
          declare -A TARGET_MAP=(
            ["x86_64-apple-darwin"]="darwin-x64:nano-rspow"
            ["aarch64-apple-darwin"]="darwin-arm64:nano-rspow"
            ["x86_64-pc-windows-msvc"]="win32-x64-msvc:nano-rspow.exe"
            ["x86_64-unknown-linux-gnu"]="linux-x64-gnu:nano-rspow"
            ["aarch64-unknown-linux-gnu"]="linux-arm64-gnu:nano-rspow"
          )
          for target in "${!TARGET_MAP[@]}"; do
            val=${TARGET_MAP[$target]}
            npm_dir=${val%%:*}
            bin_name=${val##*:}
            src="../artifacts/bindings-$target/$bin_name"
            dest="npm/$npm_dir/$bin_name"
            if [ -f "$src" ]; then
              echo "Copying $src to $dest"
              cp "$src" "$dest"
              if [[ "$bin_name" != *.exe ]]; then
                chmod +x "$dest"
              fi
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('npm/' + process.argv[1] + '/package.json', 'utf8'));
                if (!pkg.files.includes(process.argv[2])) {
                  pkg.files.push(process.argv[2]);
                  fs.writeFileSync('npm/' + process.argv[1] + '/package.json', JSON.stringify(pkg, null, 2));
                }
              " "$npm_dir" "$bin_name"
            else
              echo "⚠️ Warning: $src not found!"
            fi
          done

      - name: List platform packages
        run: ls -R nano-rspow-node/npm

      - name: Publish platform packages
        working-directory: nano-rspow-node
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✅ $name@$version is already published! Skipping."
            else
              echo "🚀 Publishing $dir ($name@$version)..."
              npm publish "$dir" --provenance --access public
            fi
          done

  publish-main:
    name: Publish main package to NPM
    runs-on: ubuntu-latest
    needs: [version-check, publish-platforms]
    if: needs.version-check.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: nano-rspow-node
        run: npm install

      - name: Publish main package
        working-directory: nano-rspow-node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "✅ $name@$version is already published! Skipping."
          else
            echo "🚀 Publishing $name@$version..."
            npm publish --provenance --access public
          fi
