name: Publish to Crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    name: Check version and publication status
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check-crates.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare major.minor versions
        run: |
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO_MM=$(echo "$CARGO" | cut -d. -f1-2)
          NODE=$(jq -r .version nano-rspow-node/package.json)
          NODE_MM=$(echo "$NODE" | cut -d. -f1-2)
          WEB=$(jq -r .version nano-rspow-web/package.json)
          WEB_MM=$(echo "$WEB" | cut -d. -f1-2)
          echo "Cargo: $CARGO  Node: $NODE  Web: $WEB"
          FAILED=0
          [ "$NODE_MM" != "$CARGO_MM" ] && echo "ERROR: Node $NODE vs Cargo $CARGO" && FAILED=1
          [ "$WEB_MM"  != "$CARGO_MM" ] && echo "ERROR: Web $WEB vs Cargo $CARGO"   && FAILED=1
          [ $FAILED -eq 1 ] && echo "Patch versions may diverge; major.minor must match." && exit 1
          echo "OK: all packages on major.minor $CARGO_MM"

      - name: Check if already published on Crates.io
        id: check-crates
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # If BOTH crates are already on crates.io, we skip the entire publish job
          if curl -s -f "https://crates.io/api/v1/crates/nano-rspow/$VERSION" >/dev/null && \
             curl -s -f "https://crates.io/api/v1/crates/nano-rspow-cli/$VERSION" >/dev/null; then
            echo "✅ Both nano-rspow@$VERSION and nano-rspow-cli@$VERSION are already on Crates.io! Skipping publish job."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 At least one crate is not yet published. Proceeding to publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish to Crates.io
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (OpenCL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev

      - name: Publish Core Crate (nano-rspow)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if curl -s -f "https://crates.io/api/v1/crates/nano-rspow/$VERSION" >/dev/null; then
            echo "✅ nano-rspow@$VERSION is already published! Skipping."
            echo "PROPAGATED=true" >> $GITHUB_ENV
          else
            echo "🚀 Publishing nano-rspow@$VERSION..."
            cargo publish -p nano-rspow
            echo "PROPAGATED=false" >> $GITHUB_ENV
          fi

      - name: Wait for nano-rspow to propagate on crates.io
        if: env.PROPAGATED == 'false'
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Target version: $VERSION"
          echo "Waiting for nano-rspow version $VERSION to propagate on crates.io..."
          for i in {1..30}; do
            if curl -s https://crates.io/api/v1/crates/nano-rspow | jq -r '.versions[].num' 2>/dev/null | grep -q "^$VERSION$"; then
              echo "Version $VERSION has propagated!"
              break
            fi
            echo "Not propagated yet. Sleeping 10s..."
            sleep 10
          done

      - name: Publish CLI Crate (nano-rspow-cli)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if curl -s -f "https://crates.io/api/v1/crates/nano-rspow-cli/$VERSION" >/dev/null; then
            echo "✅ nano-rspow-cli@$VERSION is already published! Skipping."
          else
            echo "🚀 Publishing nano-rspow-cli@$VERSION..."
            cargo publish -p nano-rspow-cli
          fi
