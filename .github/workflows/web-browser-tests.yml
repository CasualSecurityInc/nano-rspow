name: Web Browser Tests

on:
  push:
    branches:
      - main
    paths:
      - 'nano-rspow-web/**'
      - 'nano-rspow/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'nano-rspow-web/**'
      - 'nano-rspow/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: web-browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-generator:
    name: Shared generator concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nano-rspow -> .
            nano-rspow-web -> .

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nano-rspow-web/package-lock.json

      - name: Install wasm-bindgen
        # `npm run test:browser` runs `npm run build` first, which compiles
        # nano-rspow-web to wasm32 and needs this. It was missing from this job,
        # which is why the test failed with "wasm-bindgen: not found".
        uses: ./.github/actions/install-wasm-bindgen

      - name: Setup browser
        # The test drives a real browser because wgpu finds no adapter when the
        # crate is built for the host, so the WebGPU path cannot be covered by
        # `cargo test`. ubuntu-latest has no hardware adapter, so the test falls
        # back to SwiftShader there, which is slow but correct.
        run: |
          npx --yes playwright@1.56.0 install --with-deps chromium
          echo "CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -name 'chrome' -type f -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"

      - name: Run browser tests
        working-directory: nano-rspow-web
        run: npm run test:browser

  browser-demo:
    name: Browser-only dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nano-rspow -> .
            nano-rspow-web -> .

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install wasm-bindgen
        # `make web-demo-build` compiles nano-rspow-web to wasm32 and runs this.
        uses: ./.github/actions/install-wasm-bindgen

      - name: Verify prerequisites
        # The same script a developer runs, so CI and local cannot disagree
        # about the toolchain. The native addon is skipped: it is only needed by
        # the head-to-head dashboard, which CI does not build.
        run: ./scripts/setup-web-toolchain.sh --skip-addon

      - name: Build the dashboard
        # Inlines the freshly compiled WebAssembly into a single self-contained
        # index.html. --no-open because there is no browser on a runner.
        run: make web-demo-build

      - name: Verify the dashboard is complete and current
        # The same script `make web-demo-check` runs. It covers the artifact
        # being absent, incomplete, or older than the crate source: the page is
        # generated rather than committed precisely so it cannot go stale, and
        # this is what holds it to that.
        run: ./scripts/check-browser-demo.sh

      - name: Serve the dashboard and confirm it loads
        # The page is designed for file://, so a plain static server is enough
        # to prove the bundle parses and the module initialises.
        run: |
          set -euo pipefail
          cd nano-rspow-web/browser-demo
          python3 -m http.server 8080 > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8080/index.html > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/index.html > /dev/null
          echo "page served"
