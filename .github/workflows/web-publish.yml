name: Publish Web WASM Bindings

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  version-check:
    name: Check version and publication status
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check-npm.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Compare major.minor versions
        run: |
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO_MM=$(echo "$CARGO" | cut -d. -f1-2)
          NODE=$(jq -r .version nano-rspow-node/package.json)
          NODE_MM=$(echo "$NODE" | cut -d. -f1-2)
          WEB=$(jq -r .version nano-rspow-web/package.json)
          WEB_MM=$(echo "$WEB" | cut -d. -f1-2)
          echo "Cargo: $CARGO  Node: $NODE  Web: $WEB"
          FAILED=0
          [ "$NODE_MM" != "$CARGO_MM" ] && echo "ERROR: Node $NODE vs Cargo $CARGO" && FAILED=1
          [ "$WEB_MM"  != "$CARGO_MM" ] && echo "ERROR: Web $WEB vs Cargo $CARGO"   && FAILED=1
          [ $FAILED -eq 1 ] && echo "Patch versions may diverge; major.minor must match." && exit 1
          echo "OK: all packages on major.minor $CARGO_MM"

      - name: Check if already published on NPM
        id: check-npm
        run: |
          NAME=$(jq -r .name nano-rspow-web/package.json)
          VERSION=$(jq -r .version nano-rspow-web/package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "✅ $NAME@$VERSION is already published! Skipping build."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 $NAME@$VERSION is not yet published. Building."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish Web Crate to NPM
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          wget -qO- https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.121/wasm-bindgen-0.2.121-x86_64-unknown-linux-musl.tar.gz | tar -xz
          echo "${{ github.workspace }}/wasm-bindgen-0.2.121-x86_64-unknown-linux-musl" >> $GITHUB_PATH

      - name: Build Web Package
        working-directory: nano-rspow-web
        run: npm run build

      - name: Publish package
        working-directory: nano-rspow-web
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "✅ $name@$version is already published! Skipping."
          else
            echo "🚀 Publishing $name@$version..."
            npm publish --provenance --access public
          fi
