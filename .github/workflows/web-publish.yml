name: Publish Web WASM Bindings

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    name: Check major.minor version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare major.minor versions
        run: |
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO_MM=$(echo "$CARGO" | cut -d. -f1-2)
          NODE=$(jq -r .version nano-rspow-node/package.json)
          NODE_MM=$(echo "$NODE" | cut -d. -f1-2)
          WEB=$(jq -r .version nano-rspow-web/package.json)
          WEB_MM=$(echo "$WEB" | cut -d. -f1-2)
          echo "Cargo: $CARGO  Node: $NODE  Web: $WEB"
          FAILED=0
          [ "$NODE_MM" != "$CARGO_MM" ] && echo "ERROR: Node $NODE vs Cargo $CARGO" && FAILED=1
          [ "$WEB_MM"  != "$CARGO_MM" ] && echo "ERROR: Web $WEB vs Cargo $CARGO"   && FAILED=1
          [ $FAILED -eq 1 ] && echo "Patch versions may diverge; major.minor must match." && exit 1
          echo "OK: all packages on major.minor $CARGO_MM"

  publish:
    name: Publish Web Crate to NPM
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          wget -qO- https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.100/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl.tar.gz | tar -xz
          echo "${{ github.workspace }}/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl" >> $GITHUB_PATH

      - name: Build Web Package
        working-directory: nano-rspow-web
        run: npm run build

      - name: Publish package
        working-directory: nano-rspow-web
        run: npm publish --provenance --access public
