name: Python wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: nano-rspow-python

jobs:
  version-check:
    name: Check version and publication status
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check-pypi.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Compare major.minor versions
        working-directory: .
        run: |
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO_MM=$(echo "$CARGO" | cut -d. -f1-2)
          NODE=$(jq -r .version nano-rspow-node/package.json)
          NODE_MM=$(echo "$NODE" | cut -d. -f1-2)
          WEB=$(jq -r .version nano-rspow-web/package.json)
          WEB_MM=$(echo "$WEB" | cut -d. -f1-2)
          echo "Cargo: $CARGO  Node: $NODE  Web: $WEB"
          FAILED=0
          [ "$NODE_MM" != "$CARGO_MM" ] && echo "ERROR: Node $NODE vs Cargo $CARGO" && FAILED=1
          [ "$WEB_MM"  != "$CARGO_MM" ] && echo "ERROR: Web $WEB vs Cargo $CARGO"   && FAILED=1
          [ $FAILED -eq 1 ] && echo "Patch versions may diverge; major.minor must match." && exit 1
          echo "OK: all packages on major.minor $CARGO_MM"

      - name: Check if already published on PyPI
        id: check-pypi
        working-directory: .
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # Curl the PyPI JSON endpoint for this specific version.
          if curl -s -f -o /dev/null "https://pypi.org/pypi/nano-rspow-python/$VERSION/json"; then
            echo "✅ nano-rspow-python@$VERSION is already published! Skipping build."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 nano-rspow-python@$VERSION is not yet published. Building wheels."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Build wheels for each platform
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native, no QEMU needed
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            qemu: false

          # Linux aarch64 — cross-compiled on x86_64; QEMU required so the
          # manylinux arm64 container can execute its own Python interpreter.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            qemu: true

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            qemu: false

          # macOS arm64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            qemu: false

          # Windows x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            qemu: false

    steps:
      - uses: actions/checkout@v6

      # Register QEMU binfmt handlers so the arm64 manylinux container can run
      # its own binaries (including Python) on the x86_64 GitHub runner.
      # This step is skipped for all native / macOS / Windows targets.
      - name: Set up QEMU
        if: matrix.qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          working-directory: nano-rspow-python

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: nano-rspow-python/dist/*.whl

  # ---------------------------------------------------------------------------
  # Build the source distribution
  # ---------------------------------------------------------------------------
  sdist:
    name: Source distribution
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: nano-rspow-python

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: nano-rspow-python/dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Verify installable native distributions before publication
  # ---------------------------------------------------------------------------
  verify-distributions:
    name: Verify native distributions
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Download native Linux wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/wheel
      - name: Download source distribution
        uses: actions/download-artifact@v6
        with:
          name: sdist
          path: ${{ runner.temp }}/sdist
      - name: Verify the wheel includes type stubs
        run: |
          WHEEL=$(find "$RUNNER_TEMP/wheel" -name '*.whl' -print -quit)
          test -n "$WHEEL"
          unzip -l "$WHEEL" | grep -q 'nano_rspow/__init__.pyi$'
      - name: Install and test native Linux wheel
        run: |
          TEST_ENV="$RUNNER_TEMP/nano-rspow-wheel"
          WHEEL=$(find "$RUNNER_TEMP/wheel" -name '*.whl' -print -quit)
          uv venv "$TEST_ENV"
          uv pip install --python "$TEST_ENV/bin/python" "$WHEEL"
          "$TEST_ENV/bin/python" - <<'PY'
          import nano_rspow

          assert "site-packages" in nano_rspow.__file__
          assert nano_rspow.compute_difficulty(
              "718CC2121C3E641059BC1C2CFC45666C99E8AE922F7A807B7D07B62C995D79E2",
              "2bf29ef00786a6bc",
          ) == "ffffffd21c3933f4"
          PY
      - name: Install and test source distribution
        run: |
          TEST_ENV="$RUNNER_TEMP/nano-rspow-sdist"
          SDIST=$(find "$RUNNER_TEMP/sdist" -name '*.tar.gz' -print -quit)
          uv venv "$TEST_ENV"
          uv pip install --python "$TEST_ENV/bin/python" "$SDIST"
          "$TEST_ENV/bin/python" - <<'PY'
          import nano_rspow

          assert "site-packages" in nano_rspow.__file__
          assert nano_rspow.compute_difficulty(
              "718CC2121C3E641059BC1C2CFC45666C99E8AE922F7A807B7D07B62C995D79E2",
              "2bf29ef00786a6bc",
          ) == "ffffffd21c3933f4"
          PY

  # ---------------------------------------------------------------------------
  # Publish to PyPI (only on tag push)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [version-check, build, sdist, verify-distributions]
    if: needs.version-check.outputs.should_publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nano-rspow-python
    permissions:
      id-token: write  # Trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: nano-rspow-python/dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
          working-directory: nano-rspow-python
