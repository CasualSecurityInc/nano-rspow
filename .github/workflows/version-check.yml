name: Version Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Check major.minor version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract and compare major.minor versions
        run: |
          # Cargo workspace (source of truth for Rust + Python, which uses dynamic version)
          CARGO=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          CARGO_MM=$(echo "$CARGO" | cut -d. -f1-2)

          # Node.js binding
          NODE=$(jq -r .version nano-rspow-node/package.json)
          NODE_MM=$(echo "$NODE" | cut -d. -f1-2)

          # Web WASM binding
          WEB=$(jq -r .version nano-rspow-web/package.json)
          WEB_MM=$(echo "$WEB" | cut -d. -f1-2)

          echo "Cargo:  $CARGO  (major.minor: $CARGO_MM)"
          echo "Node:   $NODE   (major.minor: $NODE_MM)"
          echo "Web:    $WEB    (major.minor: $WEB_MM)"
          echo ""
          echo "Note: Python version is dynamic and derived from Cargo.toml via maturin."

          FAILED=0
          if [ "$NODE_MM" != "$CARGO_MM" ]; then
            echo "ERROR: nano-rspow-node ($NODE) major.minor does not match Cargo.toml ($CARGO)"
            FAILED=1
          fi
          if [ "$WEB_MM" != "$CARGO_MM" ]; then
            echo "ERROR: nano-rspow-web ($WEB) major.minor does not match Cargo.toml ($CARGO)"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Patch versions may diverge independently, but major.minor must stay in sync."
            exit 1
          fi

          echo "OK: all packages are on major.minor $CARGO_MM"

      - name: Check npm lockfiles match their manifests
        run: |
          # package-lock.json is version-bearing: npm stores its own copy of the
          # package version at the top level and under packages[""]. `npm install`
          # reconciles those against package.json but `npm ci` does not, so a
          # hand-edited manifest leaves the lockfile permanently behind. It does
          # not fail a publish, but it makes the tree lie about its own version.
          #
          # benchmark-compare is excluded on purpose: it is a private, unpublished
          # local experiment on its own version scheme.
          FAILED=0
          for dir in nano-rspow-node nano-rspow-web; do
            MANIFEST=$(jq -r .version "$dir/package.json")
            LOCK=$(jq -r .version "$dir/package-lock.json")
            LOCK_ENTRY=$(jq -r '.packages[""].version' "$dir/package-lock.json")
            if [ "$LOCK" != "$MANIFEST" ] || [ "$LOCK_ENTRY" != "$MANIFEST" ]; then
              echo "ERROR: $dir/package-lock.json records '$LOCK' (packages[\"\"]: '$LOCK_ENTRY') but package.json is '$MANIFEST'"
              FAILED=1
            else
              echo "OK: $dir lockfile matches package.json ($MANIFEST)"
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Use the bump script rather than editing manifests by hand:"
            echo "  node scripts/bump-version.js <patch|minor|major|new-version>"
            exit 1
          fi
