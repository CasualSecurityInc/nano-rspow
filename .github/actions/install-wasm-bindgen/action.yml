name: Install wasm-bindgen CLI
description: >
  Installs the wasm-bindgen CLI and puts it on PATH for later steps. The wasm32
  build of nano-rspow-web cannot produce a loadable module without it, so any
  job that compiles that crate needs this.

inputs:
  version:
    description: wasm-bindgen CLI version to install
    required: false
    default: '0.2.121'

runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      env:
        WASM_BINDGEN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Installed through cargo rather than by downloading the prebuilt binary
        # from the GitHub release CDN.
        #
        # That CDN refuses release-asset requests from shared CI IP ranges: a
        # fetch of wasm-bindgen-0.2.121-x86_64-unknown-linux-musl.tar.gz returns
        # 404 even though the asset is listed on the release, and so does the
        # tiny .sha256sum beside it. Several jobs fetching the same asset at once
        # made it worse, showing up as a truncated download and a baffling
        # "gzip: stdin: unexpected end of file" from tar.
        #
        # crates.io is the endpoint every step in this job already depends on,
        # so this is the one that does not fail under load. It is slower on a
        # cold cache; pair it with Swatinem/rust-cache, which this repository
        # already uses, and it is fast on every run after the first.
        #
        # Do not "optimise" this back into a release tarball download.
        #
        # Idempotent: cargo install is a no-op once the version is present.
        if command -v wasm-bindgen >/dev/null 2>&1 \
          && [ "$(wasm-bindgen --version)" = "wasm-bindgen ${WASM_BINDGEN_VERSION}" ]; then
          echo "wasm-bindgen ${WASM_BINDGEN_VERSION} already on PATH"
          exit 0
        fi

        cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
        echo "installed $(wasm-bindgen --version)"

        # Belt and braces: a caller may have had cargo's bin directory on PATH
        # already, but make the location explicit for later steps.
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "${GITHUB_PATH}"
