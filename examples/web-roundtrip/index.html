<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano RSPow Web Roundtrip Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #3b82f6;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 20px;
            border-left: 4px solid #3b82f6;
        }
        .status-item {
            margin-bottom: 8px;
        }
        .success {
            color: #10b981;
        }
        .fail {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nano-RSPow Web Roundtrip</h1>
        <p>Testing WASM initialization, generation, and validation directly in the browser.</p>
        <div class="status-box" id="status">Initializing WASM...</div>
    </div>

    <script type="module">
        import init, { generate_work, validate_work } from './node_modules/nano-rspow-web/nano_rspow_web.js';

        const statusEl = document.getElementById('status');
        function log(message, isSuccess = null) {
            const span = document.createElement('div');
            span.className = 'status-item' + (isSuccess === true ? ' success' : isSuccess === false ? ' fail' : '');
            span.textContent = message;
            statusEl.appendChild(span);
        }

        async function run() {
            try {
                statusEl.innerHTML = '';
                log("🚀 Starting browser roundtrip test...");
                
                log("⏳ Initializing nano-rspow-web WASM...");
                await init();
                log("✅ WASM initialized successfully!", true);

                const hash = "718CC2121C3E641059BC1C2CFC45666C99E8AE922F7A807B7D07B62C995D79E2";
                const threshold = "fe00000000000000"; // DEV difficulty
                
                log(`🔑 Input hash: ${hash}`);
                log(`⚙️ Generating proof of work...`);
                
                const start = performance.now();
                const result = await generate_work(hash, threshold);
                const duration = (performance.now() - start).toFixed(2);
                
                log(`🎉 Generated nonce: ${result.nonce} in ${duration}ms (is_gpu: ${result.is_gpu})`);
                
                log(`🔍 Validating work...`);
                const isValid = validate_work(hash, result.nonce, threshold);
                
                if (isValid) {
                    log("🏆 SUCCESS! Generated work is fully valid!", true);
                } else {
                    log("❌ FAILED! Generated work failed validation!", false);
                }
            } catch (err) {
                log(`💥 ERROR: ${err.message || err}`, false);
                console.error(err);
            }
        }

        run();
    </script>
</body>
</html>
